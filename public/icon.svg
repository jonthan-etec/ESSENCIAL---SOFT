<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / desktop app style -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle tech frame -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Semi-transparent glowing ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15" stroke-dasharray="16 12"/>

  <!-- Central Heavy Logistics & Power Shield / Truck / Generator Motif -->
  <g filter="url(#shadow)">
    <!-- Generator / Truck outline base -->
    <rect x="136" y="280" width="240" height="96" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="5"/>
    <line x1="160" y1="312" x2="220" y2="312" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="160" y1="332" x2="200" y2="332" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="316" cy="328" r="14" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="344" cy="328" r="8" fill="#eab308"/>

    <!-- Lightning Bolt (Energia) -->
    <path d="M276 110 L196 250 L256 250 L236 370 L324 230 L264 230 Z" 
          fill="url(#boltGrad)" 
          stroke="#ffffff" 
          stroke-width="5" 
          stroke-linejoin="round"
          stroke-linecap="round"/>
  </g>

  <!-- Windows App badge dots top left inside inner frame -->
  <circle cx="68" cy="68" r="8" fill="#38bdf8" fill-opacity="0.8"/>
  <circle cx="94" cy="68" r="8" fill="#38bdf8" fill-opacity="0.5"/>
  <circle cx="120" cy="68" r="8" fill="#38bdf8" fill-opacity="0.3"/>
</svg>
